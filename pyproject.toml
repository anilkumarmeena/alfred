[project]
name = "jarvis"
version = "0.1.0"
description = "Personal voice assistant"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ai-armory[google,mac]",
    "claude-agent-sdk>=0.2.160",
    "cryptography>=46.0",
    "httpx[http2]>=0.28.1",
    "kokoro-onnx>=0.6.1",
    # Speech recognition: MLX Whisper on Apple silicon, faster-whisper (CTranslate2) everywhere else
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "livekit-agents[silero]~=1.8",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnxruntime>=1.20",
    "openpyxl>=3.1",
    "pillow>=11.0",
    "pillow-heif>=0.18; sys_platform == 'linux'",  # iPhone HEIC photos (the Mac uses sips)
    "playwright>=1.49",
    "psutil>=7.0",
    "pypdfium2>=4.30",
    "python-dotenv>=1.2.3",
    "pywebpush>=2.5.0",
]

# Google and Mac tools come from AI Armory, pinned to a commit (docs/development.md)
[tool.uv.sources]
ai-armory = { git = "https://github.com/anilkumarmeena/ai-armory.git", rev = "99a8184b00597cf26ff8401690e70f4ef4d62614" }

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["jarvis", "conftest", "fake_cli"]

# `make check`: basic mode, all rules errors except the warnings below (hidden by make check). They cover checked
# rows/JSON typed `dict | None` and loose library stubs. See them with `uv run --with pyright pyright`.
[tool.pyright]
include = ["jarvis"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
reportOptionalIterable = "warning"
reportArgumentType = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# A task's sandbox hides .env files, which breaks collection
addopts = "--ignore=.env --ignore=.env.example"
